# Overrides on top of Yazi's built-in defaults (26.9.1). Colors and flavors are
# rendered by themectl into theme.toml, so none are set here.
#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
# Preview gets half the window (default is 1:4:3 = 37%) so images have room.
ratio          = [ 1, 3, 4 ]
sort_by        = "natural"
sort_dir_first = true
linemode       = "size_mtime"
show_hidden    = false

[preview]
# Sized for Ghostty (Kitty graphics protocol) with the preview pane at half of
# a 2560px-wide (1440p) window: 1280px wide covers the pane at 1:1, 1440px
# high covers the full window height. Anything larger would only be scaled down
# by the terminal while growing the cache. The 900px default looks soft once
# stretched to the pane. Quality 85 with lanczos3 is visibly sharper than the
# 75/triangle defaults, and a JPEG at this size is a few hundred KB per image.
max_width     = 1280
max_height    = 1440
image_quality = 85
image_filter  = "lanczos3"

[opener]
# Text opens in $EDITOR (nvim as the fallback, not vi) and Yazi waits for it.
edit = [
	{ run = '${EDITOR:-nvim} %s', desc = "$EDITOR", for = "unix", block = true },
]

# git.yazi: show Git status in the file list. Needs the setup call in init.lua.
[[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "*/"
run   = "git"
group = "git"

# Rich previews. Each is a package (see package.toml) that needs its tool on
# PATH: glow, duckdb, mediainfo, ouch.

# Markdown through glow, run by yazi-rs's piper. Reledia/glow is not used: it
# calls Command:args, which Yazi 26.9.1 removed. piper sets $t to light, dark or
# auto from the terminal; $w is the pane width.
[[plugin.prepend_previewers]]
url = "*.md"
run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s="$([ "$t" = light ] && echo light || echo dark)" "$1"'

# duckdb.yazi: tabular data. .txt and .xlsx stay with the built-in previewers,
# and so does .json, which is mostly config here and reads better highlighted.
[[plugin.prepend_previewers]]
url = "*.csv"
run = "duckdb"

[[plugin.prepend_previewers]]
url = "*.tsv"
run = "duckdb"

[[plugin.prepend_previewers]]
url = "*.parquet"
run = "duckdb"

[[plugin.prepend_previewers]]
url = "*.{db,duckdb}"
run = "duckdb"

[[plugin.prepend_preloaders]]
url   = "*.csv"
run   = "duckdb"
multi = false

[[plugin.prepend_preloaders]]
url   = "*.tsv"
run   = "duckdb"
multi = false

[[plugin.prepend_preloaders]]
url   = "*.parquet"
run   = "duckdb"
multi = false

# mediainfo.yazi: audio and video only; still images keep Yazi's native preview.
# boydaihungst/mediainfo.yazi is deprecated upstream and supports Yazi up to
# 26.9.1, so it may need replacing after a Yazi upgrade. Fallback: remove its
# two rules below; Yazi's built-in video thumbnail then applies.
[[plugin.prepend_previewers]]
mime = "{audio,video}/*"
run  = "mediainfo"

[[plugin.prepend_preloaders]]
mime = "{audio,video}/*"
run  = "mediainfo"

# ouch.yazi: archive contents (J and K scroll the preview).
[[plugin.prepend_previewers]]
mime = "application/{*zip,tar,bzip2,7z*,rar,xz,zstd,java-archive}"
run  = "ouch"
