# template | destination (symlinked to the rendered file) | reload command
# Templates live in templates/<name>.tpl and render to out/<name>.
# Reload commands run best-effort after a theme change; leave empty for none.
# Prefer a signal or an IPC call over restarting: Waybar redraws on SIGUSR2
# with the same process, so the bar never disappears between themes.
alacritty.toml | ~/.config/alacritty/theme.toml | touch ~/.config/alacritty/alacritty.toml
hypr-theme.lua | ~/.config/hypr/lua/theme.lua | if [ -n "${HYPRLAND_INSTANCE_SIGNATURE:-}" ] && pgrep -u "$(id -u)" -x Hyprland >/dev/null; then hyprctl reload; fi
hypr-theme.conf | ~/.config/hypr/theme.conf |
waybar-colors.css | ~/.config/waybar/colors.css |
waybar-config.jsonc | ~/.config/waybar/config.jsonc | pkill -SIGUSR2 -x waybar || true
swaync-colors.css | ~/.config/swaync/colors.css | if pgrep -u "$(id -u)" -x swaync >/dev/null; then swaync-client -rs; fi
rofi-config.rasi | ~/.config/rofi/config.rasi |
starship.toml | ~/.config/starship.toml |
btop.theme | ~/.config/btop/themes/themectl.theme | if pgrep -x btop >/dev/null; then pkill -SIGUSR2 -x btop; fi
ghostty-theme | ~/.config/ghostty/theme | if pgrep -x ghostty >/dev/null; then pkill -USR2 -x ghostty; fi
gtk3.css | ~/.config/gtk-3.0/gtk.css |
gtk4.css | ~/.config/gtk-4.0/gtk.css |
# Let the D-Bus request reply before restarting; an immediate restart causes NoReply.
awesome-colors.lua | ~/.config/awesome/themes/powerarrow/colors.lua | if pgrep -u "$(id -u)" -x awesome >/dev/null; then AWESOME_RLWRAP= awesome-client 'require("theme-session").restart()' </dev/null; fi
herdr-theme.toml | - |
env.sh | - |
p10k-theme.zsh | ~/.config/p10k-theme.zsh |
