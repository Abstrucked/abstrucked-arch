# ═══════════════════════════════════════════════════════════════
# Terminal Settings
# ═══════════════════════════════════════════════════════════════
set -s escape-time 0
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"                       # truecolor
set -ga terminal-overrides ',*:Ms=\E]52;c;%p1%s\a'       # OSC 52 clipboard

# Use current shell or fallback to zsh/bash
if-shell '[ -n "$SHELL" ]' {
  set-option -g default-shell "$SHELL"
} {
  if-shell 'command -v zsh >/dev/null 2>&1' {
    set-option -g default-shell "/usr/bin/zsh"
  } {
    set-option -g default-shell "/usr/bin/bash"
  }
}

# ═══════════════════════════════════════════════════════════════
# Prefix
# ═══════════════════════════════════════════════════════════════
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ═══════════════════════════════════════════════════════════════
# General Settings
# ═══════════════════════════════════════════════════════════════
set -g mouse on                           # Enable mouse support
set -g history-limit 50000                # Increase scrollback buffer
set -g base-index 1                       # Start windows at 1
setw -g pane-base-index 1                # Start panes at 1
set -g renumber-windows on               # Renumber windows when one closes
set -g set-clipboard on                  # Enable clipboard integration
set -g focus-events on                   # Enable focus events
set -sg escape-time 0                    # No delay for escape key

# Activity/bell behavior
set -g activity-action none              # Don't show activity in other windows
set -g bell-action none                  # Don't show bell in other windows
set -g visual-activity off              # Don't show visual activity
set -g visual-bell off                  # Don't show visual bell

# ═══════════════════════════════════════════════════════════════
# Status Bar
# ═══════════════════════════════════════════════════════════════
set -g status on
set -g status-interval 5                 # Update status bar every 5 seconds
set -g status-left-length 40
set -g status-right-length 80

# ═══════════════════════════════════════════════════════════════
# Copy Mode (Vi)
# ═══════════════════════════════════════════════════════════════
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi H send-keys -X start-of-line
bind -T copy-mode-vi L send-keys -X end-of-line

# Detect display server for clipboard
if-shell 'test -n "$WAYLAND_DISPLAY"' {
  # Wayland: use wl-copy
  bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
} {
  if-shell 'test -n "$DISPLAY"' {
    # X11: use xclip
    bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"
  } {
    # Fallback: use OSC 52
    bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "cat"
  }
}

# ═══════════════════════════════════════════════════════════════
# Navigation
# ═══════════════════════════════════════════════════════════════
# Vim-like pane navigation
bind -r ^ select-window -l
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# Split windows with more intuitive keys (open in current directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Resize panes with repeat-time
bind -r Up resize-pane -U 5
bind -r Down resize-pane -D 5
bind -r Left resize-pane -L 5
bind -r Right resize-pane -R 5

# Quick layout switching
bind M-1 select-layout even-horizontal
bind M-2 select-layout even-vertical
bind M-3 select-layout main-horizontal
bind M-4 select-layout main-vertical
bind M-5 select-layout tiled

# ═══════════════════════════════════════════════════════════════
# Vim-Aware Navigation (skip vim panes)
# ═══════════════════════════════════════════════════════════════
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

bind -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

# ═══════════════════════════════════════════════════════════════
# Popup Windows
# ═══════════════════════════════════════════════════════════════
# Session picker popup
bind S display-popup -E -w 80% -h 80% -d "#{pane_current_path}" \
  "tmux list-sessions -F '#{session_name}' | fzf --reverse | xargs -r tmux switch-client -t"

# Window picker popup
bind W display-popup -E -w 80% -h 80% \
  "tmux list-windows -a -F '#{session_name}:#{window_name}' | fzf --reverse | xargs -r tmux select-window -t"

# ═══════════════════════════════════════════════════════════════
# Sessionizer
# ═══════════════════════════════════════════════════════════════
# Use $HOME for consistent path resolution
if-shell 'test -f "$HOME/.local/bin/tmux-sessionizer"' {
  bind -r f run-shell "$HOME/.local/bin/tmux-sessionizer"
  bind -r C run-shell "$HOME/.local/bin/tmux-sessionizer ~/config"
  bind -r D run-shell "$HOME/.local/bin/tmux-sessionizer ~/_dev"
  # Popup version of sessionizer
  bind -r s display-popup -E -w 80% -h 80% -d "#{pane_current_path}" \
    "$HOME/.local/bin/tmux-sessionizer --popup"
} {
  # Fallback if sessionizer not found
  bind -r f display-message "tmux-sessionizer not found at ~/.local/bin/tmux-sessionizer"
}

# ═══════════════════════════════════════════════════════════════
# Reload Config
# ═══════════════════════════════════════════════════════════════
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux reloaded"

# ═══════════════════════════════════════════════════════════════
# Plugins
# ═══════════════════════════════════════════════════════════════
set -g @plugin 'tmux-plugins/tmux-yank'

# Session persistence (save/restore)
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-dir '~/.tmux/resurrect'

# Auto-save and restore
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# ═══════════════════════════════════════════════════════════════
# Theme Configuration
# ═══════════════════════════════════════════════════════════════
# Source theme if it exists, otherwise use built-in defaults
if-shell 'test -f ~/.config/tmux/theme.conf' {
  source ~/.config/tmux/theme.conf
}
