# ═══════════════════════════════════════════════════════════════
# Terminal Settings
# ═══════════════════════════════════════════════════════════════
set -s escape-time 0
set -g default-terminal "tmux-256color"
# Restore defaults before adding features so reloads also remove old overrides.
# Native clipboard support supplies OSC 52's selection AND base64-data arguments.
# xterm* (including Ghostty) is supported by default; tmux*/screen* cover nesting.
set -su terminal-overrides
set -su terminal-features
set -as terminal-features ',*:RGB,alacritty*:clipboard,tmux*:clipboard,screen*:clipboard'

# Use current shell or fallback to zsh/bash
if-shell '[ -n "$SHELL" ]' {
  set-option -g default-shell "/usr/bin/bash"
} {
  if-shell 'command -v zsh >/dev/null 2>&1' {
    set-option -g default-shell "/usr/bin/bash"
  } {
    set-option -g default-shell "/usr/bin/bash"
  }
}

# ═══════════════════════════════════════════════════════════════
# Prefix
# ═══════════════════════════════════════════════════════════════
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ═══════════════════════════════════════════════════════════════
# General Settings
# ═══════════════════════════════════════════════════════════════
set -g mouse on                           # Enable mouse support
set -g history-limit 50000                # Increase scrollback buffer
set -g base-index 1                       # Start windows at 1
setw -g pane-base-index 1                # Start panes at 1
set -g renumber-windows on               # Renumber windows when one closes
set -s set-clipboard on                  # Forward inner tmux/app OSC 52 to the terminal
set -s copy-command ''                   # Native clipboard, including over SSH
set -g focus-events on                   # Enable focus events
set -sg escape-time 0                    # No delay for escape key

# Activity/bell behavior
set -g activity-action none              # Don't show activity in other windows
set -g bell-action none                  # Don't show bell in other windows
set -g visual-activity off              # Don't show visual activity
set -g visual-bell off                  # Don't show visual bell

# ═══════════════════════════════════════════════════════════════
# Status Bar
# ═══════════════════════════════════════════════════════════════
set -g status on
set -g status-interval 5                 # Update status bar every 5 seconds
set -g status-left-length 80
set -g status-right-length 80

# ═══════════════════════════════════════════════════════════════
# Copy Mode (Vi)
# ═══════════════════════════════════════════════════════════════
setw -g mode-keys vi
set -g status-keys vi
bind [ copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle \; send-keys -X begin-selection
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi H send-keys -X top-line
bind -T copy-mode-vi M send-keys -X middle-line
bind -T copy-mode-vi L send-keys -X bottom-line

# Copy to the tmux buffer and the attached terminal's clipboard. This needs no
# display server or clipboard utility on the remote machine.
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-j send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Y send-keys -X copy-selection-and-cancel \; paste-buffer -p
bind -T copy-mode-vi M-y send-keys -X copy-selection-and-cancel \; paste-buffer -p

# Native replacements for tmux-yank's line, directory and paste shortcuts.
# Capture directly: entering and immediately exiting copy mode can suppress
# OSC 52 while tmux is waiting to redraw the pane.
bind y run-shell 'tmux capture-pane -p -t #{pane_id} -S #{cursor_y} -E #{cursor_y} | tmux load-buffer -w -t #{q:client_name} -'
bind Y run-shell 'tmux set-buffer -w -t #{q:client_name} -- #{q:pane_current_path}'
bind ] paste-buffer -p

# Clear tmux-yank's leftover bindings when reloading an existing server.
unbind -q -T copy-mode-vi !
unbind -q -T copy-mode y
unbind -q -T copy-mode Y
unbind -q -T copy-mode M-y
unbind -q -T copy-mode !
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

# ═══════════════════════════════════════════════════════════════
# Navigation
# ═══════════════════════════════════════════════════════════════
# Vim-like pane navigation
bind -r ^ select-window -l
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# Split windows with more intuitive keys (open in current directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Resize panes with repeat-time
bind -r Up resize-pane -U 5
bind -r Down resize-pane -D 5
bind -r Left resize-pane -L 5
bind -r Right resize-pane -R 5

# Quick layout switching
bind M-1 select-layout even-horizontal
bind M-2 select-layout even-vertical
bind M-3 select-layout main-horizontal
bind M-4 select-layout main-vertical
bind M-5 select-layout tiled

# ═══════════════════════════════════════════════════════════════
# Vim-Aware Navigation (skip vim panes)
# ═══════════════════════════════════════════════════════════════
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

bind -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

# ═══════════════════════════════════════════════════════════════
# Popup Windows
# ═══════════════════════════════════════════════════════════════
# Session picker popup
bind S display-popup -E -w 80% -h 80% -d "#{pane_current_path}" \
  "tmux list-sessions -F '#{session_name}' | fzf --reverse | xargs -r tmux switch-client -t"

# Window picker popup
bind W display-popup -E -w 80% -h 80% \
  "tmux list-windows -a -F '#{session_name}:#{window_name}' | fzf --reverse | xargs -r tmux select-window -t"

# Lazygit popup in the active pane's directory (like lazygit.nvim's float)
if-shell 'command -v lazygit >/dev/null 2>&1' {
  bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
} {
  bind g display-message "lazygit not installed"
}

# ═══════════════════════════════════════════════════════════════
# Sessionizer
# ═══════════════════════════════════════════════════════════════
# Use $HOME for consistent path resolution
if-shell 'test -f "$HOME/.local/bin/tmux-sessionizer"' {
  # fzf needs a TTY, which run-shell lacks (fzf exits 2), so pick in a popup
  bind f display-popup -E -w 80% -h 80% -d "#{pane_current_path}" \
    "$HOME/.local/bin/tmux-sessionizer"
  bind -r C run-shell "$HOME/.local/bin/tmux-sessionizer ~/config"
  bind -r D run-shell "$HOME/.local/bin/tmux-sessionizer ~/_dev"
} {
  # Fallback if sessionizer not found
  bind -r f display-message "tmux-sessionizer not found at ~/.local/bin/tmux-sessionizer"
}

# ═══════════════════════════════════════════════════════════════
# Agent Awareness (tmux-agentic-plugin)
# ═══════════════════════════════════════════════════════════════
# Agent strip on the right of the status bar (#{agent_status} in status-right,
# see theme.conf), agent picker on prefix + a. TPM
# loads it at the end of this file, after the theme. Agent hooks are wired
# by install.sh (plugin's bin/tmux-agent install-hooks).
set -g @plugin 'Abstrucked/tmux-agentic-plugin'
# Remote agents: ssh aliases to always ask, e.g. 'arch-svr arch-omen'.
# Hosts with a live ControlMaster connection (~/.ssh/master-*, see
# ssh/.ssh/config) are asked too; list hosts reached with tailscale ssh here.
set -g @tmux-agent-remotes ''
# Blocked/error alerts go out as critical (awesome's red agent-alert style);
# ready stays normal.
set -g @tmux-agent-notify-urgency critical

# Jump directly to the most urgent agent (blocked first), using TPM's plugin path.
bind A run-shell '"${TMUX_PLUGIN_MANAGER_PATH%/}/tmux-agentic-plugin/bin/tmux-agent" attach --next'

# Keep the original pane layout; agent state lives in the status bar.
set -g pane-border-status off

# ═══════════════════════════════════════════════════════════════
# Reload Config
# ═══════════════════════════════════════════════════════════════
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux reloaded"

# ═══════════════════════════════════════════════════════════════
# Plugins
# ═══════════════════════════════════════════════════════════════
# Session persistence (save/restore)
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-dir '~/.tmux/resurrect'
# Restoring intentionally replaces panes; don't treat those as user closures.
set -g @resurrect-hook-pre-restore-all 'tmux set-option -g @workspace-restoring on'
set -g @resurrect-hook-post-restore-all 'tmux set-option -g @workspace-restoring off'

# Auto-save and restore
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# ═══════════════════════════════════════════════════════════════
# Theme Configuration
# ═══════════════════════════════════════════════════════════════
# Source theme if it exists, otherwise use built-in defaults
if-shell 'test -f ~/.config/tmux/theme.conf' {
  source ~/.config/tmux/theme.conf
}

# TPM is installed by install.sh when the tmux component is selected.
if-shell 'test -x ~/.tmux/plugins/tpm/tpm' {
  run-shell ~/.tmux/plugins/tpm/tpm
}

# Install closure hooks after TPM exposes resurrect's save-script path. Periodic
# saves remain enabled, but closed items no longer wait for the next interval.
if-shell 'test -x "$HOME/.local/bin/tmux-save-workspace"' {
  run-shell '"$HOME/.local/bin/tmux-save-workspace" --install'
}
