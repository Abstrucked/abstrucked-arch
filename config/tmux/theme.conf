# ═══════════════════════════════════════════════════════════════
# Tmux Theme Configuration
# ═══════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────
# Status Bar
# ───────────────────────────────────────────────────────────────
set -g status-style 'bg=black,fg=white'

# Status Left: Prefix indicator + Session name
# Shows 󰌌 when prefix is pressed, 󰕰 otherwise
set -g status-left '#[fg=black,bg=green,bold]#{?client_prefix,#[fg=yellow] 󰌌 , 󰕰 } #S #[fg=green,bg=black] '

# Status Right: Date + Time
set -g status-right '#[fg=cyan,bold]%H:%M #[fg=white]│ #[fg=blue]%Y-%m-%d '

# ───────────────────────────────────────────────────────────────
# Window Status
# ───────────────────────────────────────────────────────────────
set -g window-status-separator ''

# Inactive windows
setw -g window-status-format '#[fg=gray] #I:#W '

# Active window (highlighted)
setw -g window-status-current-format '#[fg=blue,bold]#[bg=black] #I:#W #[fg=blue,bg=black]'

# Window with activity
setw -g window-status-activity-style 'fg=yellow,bg=black'

# Window with bell
setw -g window-status-bell-style 'fg=red,bg=black,bold'

# ───────────────────────────────────────────────────────────────
# Pane Borders
# ───────────────────────────────────────────────────────────────
set -g pane-border-style 'fg=gray'
set -g pane-active-border-style 'fg=blue,bg=default'
set -g pane-border-lines single

# ───────────────────────────────────────────────────────────────
# Messages
# ───────────────────────────────────────────────────────────────
set -g message-style 'fg=black,bg=brightyellow,bold'

# ───────────────────────────────────────────────────────────────
# Mode (Copy mode)
# ───────────────────────────────────────────────────────────────
setw -g mode-style 'fg=black,bg=brightcyan'

# ───────────────────────────────────────────────────────────────
# Clock
# ───────────────────────────────────────────────────────────────
setw -g clock-mode-colour cyan
setw -g clock-mode-style 24
