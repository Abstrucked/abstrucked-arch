# Colours come from the themectl palette as @thm_* options. These ANSI
# fallbacks apply where themectl has not rendered colors.conf (e.g. a server).
set -g @thm_bg 'default'
set -g @thm_fg 'white'
set -g @thm_dim 'brightblack'
set -g @thm_surface 'brightblack'
set -g @thm_surface_alt 'brightblack'
set -g @thm_accent 'blue'
set -g @thm_on_accent 'black'
set -g @thm_accent_alt 'cyan'
set -g @thm_yellow 'yellow'
set -g @thm_red 'red'
source-file -q ~/.config/tmux/colors.conf

# Status: palette background across the entire bar
set -g status-style 'bg=#{@thm_bg},fg=#{@thm_fg}'
set -g window-status-separator ''

# Explicit colors everywhere (no defaults)
set -g status-left  '#[fg=#{@thm_on_accent},bg=#{@thm_accent},bold] 󰕰 #S #[nobold,fg=#{@thm_fg},bg=#{@thm_bg}] #(~/.local/bin/tmux-git-status "#{pane_current_path}")#[fg=#{@thm_fg}]  '
set -g status-right '#[fg=#{@thm_accent_alt},bold]  #H#[nobold,fg=#{@thm_dim}]  #(whoami) '
set -g window-status-format          '#[fg=#{@thm_dim}] #I:#W '
set -g window-status-current-format  '#[bold,fg=#{@thm_accent}] #I:#W '

# Prompts, copy-mode selection and pane borders
set -g message-style 'bg=#{@thm_surface},fg=#{@thm_accent}'
set -g message-command-style 'bg=#{@thm_surface},fg=#{@thm_accent_alt}'
set -g mode-style 'bg=#{@thm_surface_alt},fg=#{@thm_fg}'
set -g pane-border-style 'fg=#{@thm_surface}'
set -g pane-active-border-style '#{?pane_in_mode,fg=#{@thm_yellow},#{?synchronize-panes,fg=#{@thm_red},fg=#{@thm_accent}}}'
