# Status: single color across the entire bar
set -g status-style ' fg=blue'
set -g window-status-separator ''

# Explicit colors everywhere (no defaults)
set -g status-left  '#[fg=green,bold] 󰕰 #S #[fg=white]  '
set -g status-right '#[fg=blue,bold]  #H#[fg=white]  #(whoami) #(test -x "$HOME/.local/bin/tmux-agent" && "$HOME/.local/bin/tmux-agent" strip)'
set -g window-status-format          '#[fg=gray] #I:#W#(test -x "$HOME/.local/bin/tmux-agent" && "$HOME/.local/bin/tmux-agent" window-dot #{window_id}) '
set -g window-status-current-format  '#[bold,fg=white] #I:#W#(test -x "$HOME/.local/bin/tmux-agent" && "$HOME/.local/bin/tmux-agent" window-dot #{window_id}) '
