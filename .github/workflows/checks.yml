name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install check tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck lua5.4 zsh stow jq tmux
      - name: Lint and validate syntax
        run: python3 -B scripts/check-syntax.py
      - name: Run isolated regression tests
        run: python3 -B -m unittest discover -s tests -v
