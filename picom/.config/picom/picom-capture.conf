# picom-capture.conf - capture-safe picom profile: opaque windows, no fading,
# shadows or rounded corners. `picom-capture` switches to it while screen
# sharing or recording, since capture records the composited image. Standalone
# on purpose: libconfig rejects duplicate settings, so it cannot @include
# picom.conf.
backend = "glx";
vsync = true;
use-damage = true;

shadow = false;
fading = false;
corner-radius = 0;

active-opacity = 1;
inactive-opacity = 1;
frame-opacity = 1;
inactive-opacity-override = false;

detect-client-opacity = true;
detect-transient = true;
log-level = "warn";
