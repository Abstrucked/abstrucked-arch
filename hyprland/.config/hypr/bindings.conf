$mainMod = SUPER
$terminal = alacritty
$layoutSwitcher = ~/.local/bin/hypr-layout
$monocleCycler = ~/.local/bin/hypr-monocle-cycle

# Screenshots and session controls.
bind = ALT, P, exec, screenshot_1
bind = ALT SHIFT, P, exec, screenshot_2
bind = ALT CTRL, at, exec, hyprlock
bind = ALT CTRL, L, exec, hypr-power-menu session

# Help, workspace navigation, and file manager.
bind = $mainMod, S, exec, hypr-keybinds
bind = $mainMod, LEFT, workspace, -1
bind = $mainMod, RIGHT, workspace, +1
bind = $mainMod, ESCAPE, workspace, previous
bind = $mainMod, grave, exec, GTK_THEME=Adwaita:dark pcmanfm
bind = $mainMod SHIFT, grave, exec, pcmanfm
bind = ALT, LEFT, workspace, -1
bind = ALT, RIGHT, workspace, +1

# Focus and movement. Hyprland has no client-index API, so cyclenext is the
# closest equivalent to Awesome's Alt-j/Alt-k bindings.
bind = ALT, J, exec, $monocleCycler next
bind = ALT, K, exec, $monocleCycler previous
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r
bind = $mainMod SHIFT, J, swapwindow, d
bind = $mainMod SHIFT, K, swapwindow, u
bind = $mainMod CTRL, J, focusmonitor, +1
bind = $mainMod CTRL, K, focusmonitor, -1
bind = $mainMod, U, focusurgentorlast
bind = $mainMod, TAB, focuscurrentorlast
bind = $mainMod SHIFT, TAB, cyclenext

# Bar and launcher controls.
bind = $mainMod, B, exec, pkill -SIGUSR1 waybar
bind = $mainMod, W, exec, hypr-launcher combi
bind = $mainMod, X, exec, hypr-launcher run
bind = $mainMod, R, exec, hypr-launcher run

# Gap and layout controls.
bind = ALT CTRL SHIFT, equal, exec, hypr-gaps +1
bind = ALT CTRL, KP_ADD, exec, hypr-gaps +1
bind = ALT CTRL, minus, exec, hypr-gaps -1
bind = ALT CTRL, KP_SUBTRACT, exec, hypr-gaps -1
bind = ALT SHIFT, H, layoutmsg, mfact -0.05
bind = ALT SHIFT, L, layoutmsg, mfact +0.05
bind = $mainMod SHIFT, H, layoutmsg, addmaster
bind = $mainMod SHIFT, L, layoutmsg, removemaster
bind = $mainMod CTRL, H, layoutmsg, orientationleft
bind = $mainMod CTRL, L, layoutmsg, orientationright
bind = $mainMod, SPACE, exec, $layoutSwitcher next
bind = $mainMod SHIFT, SPACE, exec, $layoutSwitcher previous

# Dynamic tags are not a Hyprland primitive. These chords use a named special
# workspace and a rename prompt as the closest practical replacement.
bind = $mainMod SHIFT, N, togglespecialworkspace, dynamic
bind = $mainMod SHIFT, R, exec, hypr-workspace rename
bind = $mainMod SHIFT, LEFT, movecurrentworkspacetomonitor, -1
bind = $mainMod SHIFT, RIGHT, movecurrentworkspacetomonitor, +1
bind = $mainMod SHIFT, D, togglespecialworkspace, dynamic

# Applications.
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod CTRL, R, exec, hyprctl reload
bind = $mainMod SHIFT, Q, exec, hyprctl dispatch exit
bind = $mainMod, Q, exec, brave
bind = $mainMod, D, exec, discord
bind = $mainMod, A, exec, hypr-editor
bind = $mainMod SHIFT, W, exec, $terminal -e nvim
bind = $mainMod, Z, togglespecialworkspace, quake
bind = $mainMod SHIFT, B, exec, hypr-power-menu modes

# Small system popups and optional tools.
bind = ALT, C, exec, swaync-client -t
bind = ALT, H, exec, hypr-filesystem
bind = ALT, Y, exec, hypr-launcher drun

# Wayland clipboard equivalents for the old X11 primary/clipboard bridges.
bind = $mainMod, C, exec, wl-paste --primary | wl-copy
bind = $mainMod, V, exec, wl-paste | wl-copy --primary

# Client actions. Hyprland exposes these as global dispatchers rather than
# per-client key tables.
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, C, killactive
bind = $mainMod CTRL, SPACE, togglefloating
bind = $mainMod CTRL, RETURN, layoutmsg, swapwithmaster
bind = $mainMod, O, movewindow, mon:+1
bind = $mainMod, T, pin
bind = $mainMod, N, exec, hypr-minimize
bind = $mainMod, M, fullscreen, 1
bind = $mainMod CTRL, N, togglespecialworkspace, minimized

# Volume, brightness, and media keys.
bind = , XF86MonBrightnessUp, exec, brightnessctl set 10%+
bind = , XF86MonBrightnessDown, exec, brightnessctl set 10%-
bind = , XF86KbdBrightnessUp, exec, brightnessctl --device='*::kbd_backlight' set 10%+
bind = , XF86KbdBrightnessDown, exec, brightnessctl --device='*::kbd_backlight' set 10%-
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%+
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = ALT $mainMod, DOWN, exec, playerctl stop
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86AudioNext, exec, playerctl next

# Workspaces 1 through 9. Ctrl-number retains the old chord but necessarily
# focuses the workspace because Hyprland cannot display multiple tags this way.
bind = $mainMod, 1, workspace, 1
bind = $mainMod CTRL, 1, workspace, 1
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod CTRL SHIFT, 1, movetoworkspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod CTRL, 2, workspace, 2
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod CTRL SHIFT, 2, movetoworkspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod CTRL, 3, workspace, 3
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod CTRL SHIFT, 3, movetoworkspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod CTRL, 4, workspace, 4
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod CTRL SHIFT, 4, movetoworkspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod CTRL, 5, workspace, 5
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod CTRL SHIFT, 5, movetoworkspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod CTRL, 6, workspace, 6
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod CTRL SHIFT, 6, movetoworkspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod CTRL, 7, workspace, 7
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod CTRL SHIFT, 7, movetoworkspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod CTRL, 8, workspace, 8
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod CTRL SHIFT, 8, movetoworkspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod CTRL, 9, workspace, 9
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod CTRL SHIFT, 9, movetoworkspace, 9

# Mouse equivalents for Awesome's mod-drag behavior.
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
