# Application placement mirrors the AwesomeWM rules.
windowrule = workspace 3 silent, match:class ^(Brave|Brave-browser|brave-browser)$
windowrule = workspace 7 silent, match:class ^(discord|Discord)$
windowrule = workspace 3 silent, match:class ^(Gimp|gimp|Gimp-3.0)$
windowrule = maximize, match:class ^(Gimp|gimp|Gimp-3.0)$

# Applications picom keeps fully opaque through its opacity-rule list.
windowrule = opacity 1.0 1.0, match:class ^(Brave|Brave-browser|brave-browser)$
windowrule = opacity 1.0 1.0, match:class ^(Gimp|gimp|Gimp-3.0)$
windowrule = opacity 1.0 1.0, match:class ^(org.inkscape.Inkscape|Inkscape|inkscape)$
windowrule = opacity 1.0 1.0, match:class ^(vlc|VLC|mpv|MPlayer)$
windowrule = opacity 1.0 1.0, match:class ^(org.gnome.Loupe|eog|imv|feh)$

# A persistent special workspace provides the old quake-terminal workflow.
windowrule = float, match:class ^(dropdown-terminal)$
windowrule = size 90% 85%, match:class ^(dropdown-terminal)$
windowrule = center, match:class ^(dropdown-terminal)$
windowrule = workspace special:quake silent, match:class ^(dropdown-terminal)$
