general {
    gaps_in = 4
    gaps_out = 4
    border_size = 0
    col.active_border = rgba(fab387ff)
    col.inactive_border = rgba(89dcebff)
    layout = dwindle
    allow_tearing = false
}

decoration {
    rounding = 8
    # picom's active-opacity and inactive-opacity in the AwesomeWM session.
    # Toggle at runtime with hypr-opacity.
    active_opacity = 0.95
    inactive_opacity = 0.75
    fullscreen_opacity = 1.0

    shadow {
        enabled = false
    }

    blur {
        enabled = false
        size = 3
        passes = 2
    }
}

animations {
    enabled = true
    bezier = easeOut, 0.05, 0.9, 0.1, 1.05
    # Linear, to match picom's constant opacity step per fade-delta tick in
    # the AwesomeWM session.
    bezier = picomFade, 0, 0, 1, 1
    animation = windows, 1, 4, easeOut
    animation = windowsOut, 1, 4, easeOut, popin 80%
    animation = border, 1, 4, default
    animation = fade, 1, 4, default
    # Workspace switching crossfades like picom does on tag switch. Speeds are
    # picom's fade-in-step 0.028 and fade-out-step 0.03 at fade-delta 10ms,
    # which come to 360ms in and 340ms out.
    animation = workspaces, 1, 3.6, picomFade, fade
    animation = workspacesOut, 1, 3.4, picomFade, fade
}

dwindle {
    pseudotile = true
    preserve_split = true
    smart_split = true
    smart_resizing = true
}

master {
    new_status = master
    mfact = 0.50
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = true
    focus_on_activate = true
}

xwayland {
    force_zero_scaling = true
}
