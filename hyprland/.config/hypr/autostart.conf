# The helper starts the compositor services only once per login.
exec-once = hypr-session-start

# Resident Ghostty for ghostty-window. Started from the session so it has the
# full environment; the last flag keeps it alive when its last window closes.
exec-once = ghostty --gtk-single-instance=true --initial-window=false --quit-after-last-window-closed=false

# Keep a terminal available in the special workspace without showing it on
# the initial desktop.
exec-once = [workspace special:quake silent] alacritty --class dropdown-terminal
