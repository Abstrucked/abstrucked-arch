background {
    monitor =
    color = rgba(30, 30, 46, 1.0)
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 2
    outer_color = rgba(192, 192, 162, 1.0)
    inner_color = rgba(49, 50, 68, 1.0)
    font_color = rgba(205, 214, 244, 1.0)
    fade_on_empty = false
    placeholder_text = Password...
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(205, 214, 244, 1.0)
    font_size = 64
    font_family = JetBrains Mono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}
