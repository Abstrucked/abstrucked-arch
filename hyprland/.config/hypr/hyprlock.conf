background {
    monitor =
    color = rgba(30, 30, 46, 1.0)
    path = ~/.backgrounds/cosmo.png
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 2
    outer_color = rgba(250, 179, 135, 1.0)
    check_color = rgba(137, 220, 235, 1.0)
    fail_color = rgba(243, 139, 168, 1.0)
    fail_text = <i>$FAIL</i>
    inner_color = rgba(49, 50, 68, 1.0)
    font_color = rgba(205, 214, 244, 1.0)
    fade_on_empty = false
    placeholder_text = Password...
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(205, 214, 244, 1.0)
    font_size = 64
    font_family = JetBrains Mono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}
