source = ~/.config/hypr/theme.conf

background {
    monitor =
    color = $lock_bg
    path = ~/.backgrounds/cosmo.png
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
}

# Per-output backgrounds from display-detect, drawn over the catch-all above.
# Generated (gitignored); hyprlock logs and skips it if it's missing.
source = ~/.config/hypr/lock-backgrounds.conf

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 2
    outer_color = $lock_outer
    check_color = $lock_check
    fail_color = $lock_fail
    fail_text = <i>$FAIL</i>
    inner_color = $lock_inner
    font_color = $lock_fg
    fade_on_empty = false
    placeholder_text = Password...
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $lock_fg
    font_size = 64
    font_family = JetBrains Mono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}
