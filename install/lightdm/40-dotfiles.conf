# lightdm-gtk-greeter settings, installed by install/lightdm-greeter.sh into
# /etc/xdg/lightdm/lightdm-gtk-greeter.conf.d/. Colors and wallpapers come from
# the active themectl theme via 60-themectl.conf, which sorts after this.
[greeter]
theme-name=themectl-greeter
icon-theme-name=Adwaita
font-name=JetBrainsMono Nerd Font 11
# The theme's wallpaper, not a per-user one from AccountsService.
user-background=false
default-user-image=#avatar-default-symbolic
indicators=~host;~spacer;~clock;~spacer;~session;~a11y;~power
clock-format=%a %d %b   %H:%M
transition-type=none
